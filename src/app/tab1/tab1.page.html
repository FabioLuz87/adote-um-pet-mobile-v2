<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Usuários
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Usuários</ion-title>
    </ion-toolbar>
  </ion-header>
    <ion-list>
      @for (item of usuarios; track item; let index = $index) {
      <ion-item>
          
        <ion-card>
          <ion-card-header>
            <ion-card-title>{{ item.nome }}</ion-card-title>
            <ion-card-subtitle>{{ item.cpf }}</ion-card-subtitle>
          </ion-card-header>
          
          <ion-card-content>
            PERFIL: {{item.perfil}} | TELEFONE: {{item.telefone}}
          </ion-card-content>
        </ion-card>
      </ion-item>
      }
    </ion-list>
  
</ion-content>
