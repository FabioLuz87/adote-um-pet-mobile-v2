<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Entidades Acolhedoras
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Entidades Acolhedoras</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-list>
    @for (item of entidades; track item; let index = $index) {
    <ion-item>
      <ion-card>
        <ion-card-header>
          <ion-card-title>{{ item.nome }}</ion-card-title>
          <ion-card-subtitle>{{ item.cnpj }}</ion-card-subtitle>
        </ion-card-header>
        
        <ion-card-content>
          ENDEREÇO: {{item.endereco?.cidade}} 
        </ion-card-content>
      </ion-card>
    </ion-item>
    }
  </ion-list>
</ion-content>
